<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Journal de l'import des posts LinkedIn</title>
<style>
  body { font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 20px 16px; background: #f3f5f4; color: #18231f; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 0 0 6px; }
  p.aide { color: #5b6b64; margin: 0 0 16px; }
  .barre { display: flex; gap: 8px; margin-bottom: 16px; }
  button { font: 600 .9rem system-ui, sans-serif; padding: 8px 14px; border-radius: 8px; border: 1px solid #d7dfdb; background: #fff; cursor: pointer; }
  ol { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  li { background: #fff; border: 1px solid #d7dfdb; border-radius: 8px; padding: 10px 12px; }
  li.ok { border-color: #1f6f5c; background: #e1efe9; }
  li.ko { border-color: #a2342b; background: #f9e3e0; }
  .etape { font-weight: 700; }
  .heure { color: #5b6b64; font-size: .82rem; }
  dl { margin: 6px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; font-size: .88rem; }
  dt { color: #5b6b64; }
  dd { margin: 0; overflow-wrap: anywhere; }
  .vide { color: #5b6b64; }
</style>
</head>
<body>
<main>
  <h1>Journal de l'import des posts LinkedIn</h1>
  <p class="aide">Chaque enregistrement (Ctrl+S) d'une recherche LinkedIn laisse ici une trace, du plus récent au plus ancien. Utile en cas de panne.</p>
  <div class="barre"><button id="actualiser" type="button">Actualiser</button><button id="vider" type="button">Vider le journal</button></div>
  <ol id="liste"></ol>
</main>
<script src="journal.js"></script>
</body>
</html>
